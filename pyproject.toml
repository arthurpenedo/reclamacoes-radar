[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reclamacoes-radar"
version = "0.1.0"
description = "Indicadores de reclamações do consumidor.gov.br com DuckDB, SQL e resumo executivo com IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = ["anthropic>=1.0", "pydantic>=2.6", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reclamacoes-radar = "reclamacoes_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
