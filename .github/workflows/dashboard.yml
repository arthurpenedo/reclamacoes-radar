name: Dashboard

# Gera o dashboard a partir da amostra e publica no GitHub Pages a cada push na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: |
          mkdir -p site
          reclamacoes-radar carregar data/amostra_sintetica.csv --db radar.duckdb
          reclamacoes-radar dashboard --db radar.duckdb --saida site/index.html
      - name: Resumo executivo com modelo aberto (Ollama, qwen2.5:3b) + trava de números
        # Opcional: se falhar, fica o dashboard sem resumo gerado no passo anterior.
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull qwen2.5:3b
          reclamacoes-radar dashboard --db radar.duckdb --saida site/index.html --resumo ollama
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
